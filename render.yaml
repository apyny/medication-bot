# Render.com blueprint (alternative to Railway). Deploy via "Blueprint" in Render.
services:
  - type: web
    name: medication-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
      - key: TIMEZONE
        sync: false
    healthCheckPath: /